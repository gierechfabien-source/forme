<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Forme en 20 min</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forme">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2f5bff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" id="ico" href="data:,">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#e8edf2; --card:#f8fafc; --ink:#101c28; --muted:#586677; --line:#d2dae3;
  --accent:#2f5bff; --accent-ink:#ffffff; --soft:#dfe6ff; --ok:#0f9d6b; --bad:#d6452b;
  --head:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c131b; --card:#142030; --ink:#eaf0f7; --muted:#93a3b6; --line:#233246;
    --accent:#5d86ff; --accent-ink:#06101f; --soft:#1b2c52; --ok:#35c993; --bad:#ff7a5f;
  }
}
:root[data-theme="dark"]{
  --bg:#0c131b; --card:#142030; --ink:#eaf0f7; --muted:#93a3b6; --line:#233246;
  --accent:#5d86ff; --accent-ink:#06101f; --soft:#1b2c52; --ok:#35c993; --bad:#ff7a5f;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1;letter-spacing:.01em}
h1{font-size:46px;font-weight:800}
h2{font-size:30px;font-weight:700;margin:28px 0 10px}
h3{font-size:26px;font-weight:700}
.lead{color:var(--muted);margin:8px 0 0}
.plan{margin:14px 0 0;padding:14px 16px;border-radius:14px;background:var(--soft);font-weight:500}
.seg{display:flex;gap:6px;margin:14px 0 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;font-weight:600;color:var(--muted);line-height:1.15}
.seg button small{display:block;font-weight:400;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toggle{display:flex;align-items:center;gap:10px;margin:14px 2px 0;color:var(--muted)}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.sess{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.sess .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sess .time{font-family:var(--head);font-weight:700;font-size:30px;color:var(--accent);white-space:nowrap}
.sess p{margin:6px 0 0;color:var(--muted)}
.go{display:block;width:100%;margin-top:14px;padding:14px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:18px}
details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;padding:4px 0}
.ex{padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex b{display:block;font-size:18px}
.ex span{color:var(--muted);font-size:15px;display:block}
.ex .mus{color:var(--accent);font-weight:500;margin-top:2px}
.ex em{font-style:normal;font-size:15px;color:var(--ok);display:block;margin-top:2px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;padding:12px 4px;border-radius:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.tip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.tip h3{font-size:24px;margin-bottom:6px}
.tip p{margin:0;color:var(--muted)}
.tip p+p{margin-top:8px}
.week{display:flex;gap:6px;margin-top:10px}
.week div{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;color:var(--muted);font-size:15px}
.week div.on{background:var(--ok);border-color:var(--ok);color:#fff}
.week div.today{border-color:var(--accent);border-width:2px}
.stat{display:flex;gap:10px;margin-top:12px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font-family:var(--head);font-size:42px;display:block;line-height:1;color:var(--accent)}
.stat span{color:var(--muted);font-size:15px}
.row{display:flex;gap:8px;margin-top:10px}
.row input,.grid2 input{flex:1;min-width:0;width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.row button,.btn{padding:12px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{display:block;width:100%;margin-top:12px;font-size:18px;padding:14px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grid2 label{display:block;font-size:14px;color:var(--muted);font-weight:500}
.grid2 label input{margin-top:4px;color:var(--ink)}
ul.log{list-style:none;margin:10px 0 0;padding:0}
ul.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.log li span{color:var(--muted);text-align:right}
.empty{color:var(--muted);margin:10px 0 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile b{font-family:var(--head);font-size:34px;line-height:1;color:var(--accent);display:block}
.tile span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tile i{font-style:normal;font-size:14px;font-weight:600}
.say{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin-top:10px}
.say.good{border-left-color:var(--ok)}
.say.warn{border-left-color:var(--bad)}
.say b{display:block}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 4px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-top:1px solid var(--line);text-align:right}
.up{color:var(--ok);font-weight:600}
.down{color:var(--bad);font-weight:600}
.neutral{color:var(--muted)}
.spark{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.spark small{color:var(--muted);display:block}
.spark svg{display:block;width:100%;height:60px;margin-top:4px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:8px}
.chk input{width:24px;height:24px;accent-color:var(--accent)}
.small{font-size:14px;color:var(--muted)}

/* panneau manga */
.fig{width:100%;max-width:460px;margin:10px auto;aspect-ratio:320/213;border-radius:14px;overflow:hidden;background:#dcebf2}
.fig svg{display:block;width:100%;height:100%}
.fig.hero{margin-top:16px}

/* écran de séance */
#run{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);transition:background .25s}
#run.on{display:flex}
#run.rest{background:var(--card);color:var(--ink)}
#run.done{background:var(--ok);color:#fff}
.rtop{display:flex;justify-content:space-between;font-weight:600;font-size:18px}
.bar{height:6px;border-radius:3px;background:rgba(127,127,127,.3);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:currentColor;transition:width .3s linear}
.rmid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:0}
.phase{font-size:19px;font-weight:600;opacity:.85}
.count{font-family:var(--head);font-weight:800;font-size:min(26vw,118px);line-height:.95;font-variant-numeric:tabular-nums;margin:2px 0}
#run .fig{width:auto;height:min(28vh,220px);max-width:100%;margin:6px auto}
.rname{font-family:var(--head);font-weight:700;font-size:clamp(30px,9vw,46px);line-height:1}
.rdesc{margin:8px auto 0;max-width:430px;font-size:17px;opacity:.92}
.reasy{margin:6px auto 0;max-width:430px;font-size:15px;opacity:.8}
.next{margin-top:6px;font-size:18px;opacity:.9}
.rbtn{display:flex;gap:10px;margin-top:10px}
.rbtn button{flex:1;padding:15px;border-radius:14px;font-weight:600;font-size:18px;background:rgba(255,255,255,.2);color:inherit}
#run.rest .rbtn button{background:var(--soft)}
.rbtn button.main{background:#fff;color:#101c28}
#run.rest .rbtn button.main{background:var(--accent);color:var(--accent-ink)}
@media (max-height:700px){.reasy{display:none}.rdesc{font-size:15px}#run .fig{height:min(24vh,170px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#run.cool{background:#17806d;color:#fff}
#run.cool .rbtn button{background:rgba(255,255,255,.2)}
#run.cool .rbtn button.main{background:#fff;color:#0f4f44}
.prog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.prog h3{font-size:26px}
.prog .dots{display:flex;gap:5px;margin-top:10px;flex-wrap:wrap}
.prog .dots i{width:20px;height:20px;border-radius:50%;background:var(--line);display:block}
.prog .dots i.done{background:var(--ok)}
.prog .dots i.next{background:var(--accent)}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bd{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.bd b{display:block;font-size:16px}
.bd span{font-size:13px}
.bd.on{background:var(--soft);color:var(--ink);border-color:var(--accent)}
.sw{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--ink)}
.tabs button{font-size:15px;padding:12px 2px}
#tbar{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#tbar.on{display:flex}
#tbar.hold{background:var(--accent);color:var(--accent-ink)}
#tbar .tl{display:block;font-size:14px;opacity:.85}
#tbar b{font-family:var(--head);font-size:34px;line-height:1}
.tbtn{display:flex;gap:8px}
.tbtn button{white-space:nowrap;padding:10px 12px;border-radius:10px;background:rgba(127,127,127,.3);font-weight:600;color:inherit}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.setb{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);font-weight:600;font-size:18px;background:var(--card)}
.setb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.dayb{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;color:var(--muted)}
.dayb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs button{font-size:14px}
.seg.lv{flex-wrap:wrap}.seg.lv button{flex:1 1 28%}
.tabs button{font-size:12.5px;padding:12px 1px}
.srows{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.srow.ok{border-color:var(--ok)}
.sn{width:26px;text-align:center;font-weight:600;color:var(--muted)}
.fld{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
.fld input{width:100%;min-width:0;font:inherit;font-size:17px;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.fld small{color:var(--muted);font-size:13px}
.fld.kg{flex:1.6}
.okb{padding:11px 9px;border-radius:10px;font-weight:600;background:var(--soft);color:var(--ink);white-space:nowrap}
.okb.on{background:var(--ok);color:#fff}
.last{margin:6px 0 0;color:var(--muted);font-size:15px}
.last.up{color:var(--ok);font-weight:600}
</style>
</head>

<script>
/* ---------- stockage (protégé) ---------- */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- icône d'écran d'accueil ---------- */
(function(){
  try{
    var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d');
    x.fillStyle='#2f5bff';x.fillRect(0,0,180,180);
    x.fillStyle='#fff';
    function r(a,b,w,h,rad){x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,rad);else x.rect(a,b,w,h);x.fill()}
    r(22,62,18,56,6);r(44,48,18,84,6);r(62,82,56,16,4);r(118,48,18,84,6);r(140,62,18,56,6);
    var u=c.toDataURL('image/png');
    document.getElementById('ico').href=u;
  }catch(e){}
})();

/* =====================================================
   PERSONNAGE : illustration douce, torse nu et short.
   Les zones musclées s'allument en rouge, avec une
   annotation en pointillés. Le décor change.
   ===================================================== */
var K={sk:'#e9b58f',sks:'#d29c76',skf:'#cf9774',skfs:'#b98160',sh:'#2f3a54',shs:'#222b40',shf:'#26304a',shfs:'#1b2336',hair:'#1c1722',shoe:'#2a3140',shoes:'#171c27',sock:'#3a4256',red:'#ff3b4a'};
var LOOK=load('fit:look',{c:0,h:0,b:1});
if(!LOOK||typeof LOOK.c!=='number')LOOK={c:0,h:0,b:1};
var SHORTC=[['Bleu nuit','#2f3a54'],['Noir','#262a33'],['Rouge','#b8323c'],['Vert','#2e8b57'],['Orange','#e08a1e'],['Violet','#6a4c93']];
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
function applyLook(){var c=SHORTC[LOOK.c]||SHORTC[0];K.sh=c[1];K.shs=shade(c[1],0.72);K.shf=shade(c[1],0.84);K.shfs=shade(c[1],0.6)}
K.cool='#27b3a0';applyLook();
function ik(a,b,l1,l2,s){
  var dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||0.01;
  var dd=Math.min(Math.max(d,Math.abs(l1-l2)+0.5),l1+l2-0.5),ux=dx/d,uy=dy/d;
  var ca=(l1*l1+dd*dd-l2*l2)/(2*l1*dd);ca=Math.max(-1,Math.min(1,ca));
  var th=Math.atan2(uy,ux)+s*Math.acos(ca);
  return {m:[a[0]+l1*Math.cos(th),a[1]+l1*Math.sin(th)],e:[a[0]+ux*dd,a[1]+uy*dd]};
}
function pd(p){return 'M'+p.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' L')+' Z'}
function lim(a,b,w0,w1,bul){
  var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
  if(nx*0.3+ny*0.9<0){nx=-nx;ny=-ny}
  var N=12,A=[],B=[],X=[],i;
  for(i=0;i<=N;i++){var t=i/N,w=(w0+(w1-w0)*t+bul*Math.sin(Math.PI*t))/2,cx=a[0]+dx*t,cy=a[1]+dy*t;A.push([cx+nx*w,cy+ny*w]);B.push([cx-nx*w,cy-ny*w]);X.push([cx+nx*w*0.2,cy+ny*w*0.2])}
  var P=A.slice(),r1=w1/2,r0=w0/2,ph;
  for(i=1;i<8;i++){ph=Math.PI*i/8;P.push([b[0]+r1*(Math.cos(ph)*nx+Math.sin(ph)*ux),b[1]+r1*(Math.cos(ph)*ny+Math.sin(ph)*uy)])}
  P=P.concat(B.slice().reverse());
  for(i=1;i<8;i++){ph=Math.PI*i/8;P.push([a[0]-r0*(Math.cos(ph)*nx+Math.sin(ph)*ux),a[1]-r0*(Math.cos(ph)*ny+Math.sin(ph)*uy)])}
  return {d:pd(P),sd:pd(A.concat(X.slice().reverse()))};
}
function part(a,b,w0,w1,bul,c,sc){var l=lim(a,b,w0,w1,bul);return '<path d="'+l.d+'" fill="'+c+'"/><path d="'+l.sd+'" fill="'+sc+'"/>'}
function blob(c,r,col,op){return '<circle cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="'+r+'" fill="'+col+'"'+(op!==undefined?' opacity="'+op+'"':'')+'/>'}
function lerp2(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
function arm(S,W,sg,far){
  var r=ik(S,W,27,25,sg),c=far?K.skf:K.sk,sc=far?K.skfs:K.sks;
  return blob(S,10.5,c)+part(S,r.m,15,12,5.5,c,sc)+blob(r.m,6.2,c)+part(r.m,r.e,12.5,9,3.5,c,sc)+blob(r.e,6.2,c);
}
function leg(P,A,ft,sg,far){
  var r=ik(P,A,40,38,sg),Kn=r.m,E=r.e,tt=[E[0]+ft[0],E[1]+ft[1]],c=far?K.skf:K.sk,sc=far?K.skfs:K.sks;
  return part(P,Kn,23,16,5,c,sc)+blob(Kn,8,c)+part(Kn,E,15.5,10,5,c,sc)+
   part(P,lerp2(P,Kn,0.58),26,22.5,2.5,far?K.shf:K.sh,far?K.shfs:K.shs)+
   part(lerp2(Kn,E,0.8),E,11.5,10.5,0,far?'#2c3346':K.sock,far?'#232a3b':'#2b3245')+
   part([E[0]-1,E[1]+3],[tt[0],tt[1]+3.5],12,9.5,0.5,far?K.shoes:K.shoe,K.shoes);
}
var HS=['M-12.5,2 C-14,-11 -3,-16 7,-12.5 C11,-11 12.5,-7 12,-3 C6,-7 -2,-7.5 -7,-4.5 C-9.5,-3 -11,0 -12.5,2Z',
 'M-12.5,2 C-14,-8 -10,-13 -8,-18 L-4,-13 L-2,-20 L2,-13 L6,-19 L8,-12 L12,-15 L12,-3 C6,-7 -2,-7.5 -7,-4.5 C-9.5,-3 -11,0 -12.5,2Z',

function plan(s,ov){
  var iv=INT[ov&&ov.i!==undefined?ov.i:S.int],st=[],n=s.ex.length,j,k;
  if(s.stretch){s.ex.forEach(function(x){st.push({t:'cool',k:x,dur:40,round:0})});return {steps:st,rounds:1}}
  var warm=S.warm,cool=S.cool,slots;
  if(ov&&ov.r)slots=ov.r*n;
  else if(S.dur!=='auto'){var budget=S.dur*60-(warm?WARM.length*30:0)-(cool?STRETCH.length*30:0);slots=Math.max(2,Math.round((budget+iv.r)/(iv.w+iv.r)))}
  else slots=s.rounds*n;
  if(warm)WARM.forEach(function(x){st.push({t:'warm',k:x,dur:30,round:0})});
  for(j=0;j<slots;j++){k=s.ex[j%n];st.push({t:'work',k:k,dur:iv.w,round:Math.floor(j/n)+1});if(j<slots-1)st.push({t:'rest',dur:iv.r,round:Math.floor(j/n)+1})}
  if(cool)STRETCH.forEach(function(x){st.push({t:'cool',k:x,dur:30,round:0})});
  for(j=0;j<st.length;j++){if(st[j].t==='rest'){var nx=st[j+1];st[j].next=nx?nx.k:null}}
  return {steps:st,rounds:Math.ceil(slots/n)};
}
function mins(s,ov){var t=0;plan(s,ov).steps.forEach(function(x){t+=x.dur});return Math.round(t/60)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

var PSEQ=['A','B','C','G','H','D','A','F','C','B','D','L'];
var PW=[{i:0,r:2,n:'Prise en main'},{i:1,r:2,n:'On monte le rythme'},{i:1,r:3,n:'Pleine puissance'},{i:2,r:3,n:'Sprint final'}];

function progCard(){
  var p=getProg(),h='<div class="prog">';
  if(!p){h+='<h3>Programme 4 semaines</h3><p class="lead" style="margin-top:6px">12 séances, la difficulté monte chaque semaine. L’appli choisit la séance du jour pour toi.</p><button class="go" onclick="startProg()">Commencer le programme</button>'}
  else if(p.i>=12){h+='<h3>Programme terminé</h3><p class="lead" style="margin-top:6px">Bravo, les 12 séances sont faites. Tu peux recommencer.</p><button class="go" onclick="startProg()">Recommencer</button>'}
  else{
    var w=Math.floor(p.i/3),W=PW[w],s=SESS[sessById(PSEQ[p.i])],ov={i:W.i,r:W.r};
    h+='<h3>Semaine '+(w+1)+' sur 4</h3><p class="lead" style="margin-top:6px">'+W.n+'. Séance '+(p.i%3+1)+' sur 3 : <b>'+esc(s.name)+'</b>, environ '+mins(s,ov)+' min ('+INT[W.i].n.toLowerCase()+', '+W.r+' tours).</p><div class="dots">';
    for(var i=0;i<12;i++)h+='<i class="'+(i<p.i?'done':i===p.i?'next':'')+'"></i>';
    h+='</div><button class="go" onclick="launchProg()">Lancer la séance du programme</button><button class="btn ghost" onclick="stopProg()">Arrêter le programme</button>';
  }
  return h+'</div>';
}

function dayNum(iso){var d=new Date(iso);d.setHours(0,0,0,0);return Math.round(d.getTime()/86400000)}
function dayList(L){var o={};L.forEach(function(l){o[dayNum(l.d)]=1});return Object.keys(o).map(Number).sort(function(a,b){return a-b})}
function streak(L){
  var days=dayList(L),set={};days.forEach(function(d){set[d]=1});
  var t=dayNum(new Date().toISOString());
  if(!set[t]){t--;if(!set[t])return 0}
  var n=0;while(set[t]){n++;t--}return n;
}
function bestStreak(L){var d=dayList(L),best=0,run=0;for(var i=0;i<d.length;i++){run=(i&&d[i]-d[i-1]===1)?run+1:1;if(run>best)best=run}return best}
function bestWeek(L){var w={},best=0;L.forEach(function(l){var k=dkey(monday(new Date(l.d)));w[k]=(w[k]||0)+1;if(w[k]>best)best=w[k]});return best}
function distinct(L){var o={};L.forEach(function(l){o[l.s]=1});return Object.keys(o).length}

function monday(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);x.setHours(0,0,0,0);return x}
function fdate(iso){return new Date(iso).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}

function spark(vals,label,unit){
  if(vals.length<2)return '';
  vals=vals.slice(-12);
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1,W=300,Hh=60;
  var pts=vals.map(function(v,i){return [8+i*(W-16)/(vals.length-1),Hh-8-(v-mn)/rg*(Hh-16)]});
  var path=pts.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  var last=pts[pts.length-1];
  return '<div class="spark"><small>'+label+' : de '+fmt(vals[0])+' à '+fmt(vals[vals.length-1])+' '+unit+'</small><svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Courbe '+label+'"><path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="var(--accent)"/></svg></div>';
}

function analyse(m,h){
  var tiles='',says='';
  function lastv(k){var s=series(m,k);return s.length?s[s.length-1].v:null}
  var kg=lastv('kg'),w=lastv('waist'),n=lastv('neck'),H=h/100;
  if(kg){
    var bmi=kg/(H*H),c=bmi<18.5?'insuffisance pondérale':bmi<25?'corpulence normale':bmi<30?'surpoids':'obésité';
    tiles+='<div class="tile"><b>'+fmt(bmi)+'</b><span>IMC</span><i>'+c+'</i></div>';
  }
  if(w){
    var r=w/h,cat=r<0.5?'zone idéale':r<0.6?'à réduire':'élevé';
    tiles+='<div class="tile"><b>'+r.toFixed(2).replace('.',',')+'</b><span>Taille / hauteur</span><i>'+cat+'</i></div>';
  }
  var bf=null;
  if(w&&n&&w>n){
    bf=495/(1.0324-0.19077*Math.log10(w-n)+0.15456*Math.log10(h))-450;
    if(bf>3&&bf<50){
      var bc=bf<14?'athlétique':bf<18?'sportif':bf<25?'moyen':'élevé';
      tiles+='<div class="tile"><b>'+fmt(bf)+' %</b><span>Masse grasse estimée</span><i>'+bc+'</i></div>';
      if(kg)tiles+='<div class="tile"><b>'+fmt(kg*(1-bf/100))+' kg</b><span>Masse maigre estimée</span><i>gras : '+fmt(kg*bf/100)+' kg</i></div>';
    }else bf=null;
  }
  if(kg){
    says+='<div class="say"><b>Poids et IMC</b>L’IMC ne distingue pas le muscle de la graisse : avec de la masse musculaire, il exagère le surpoids. Regarde-le avec ton tour de taille.</div>';
  }
  if(w){
    var tg=Math.round(h*0.5*10)/10;
    if(w>tg)says+='<div class="say warn"><b>Ventre : objectif '+fmt(tg)+' cm</b>Ton tour de taille est de '+fmt(w)+' cm. Le repère santé est de rester sous la moitié de ta hauteur, soit '+fmt(tg)+' cm. Il te reste '+fmt(w-tg)+' cm à gagner : c’est ta priorité pour retrouver un ventre plat.</div>';
    else says+='<div class="say good"><b>Ventre : sous le repère</b>Ton tour de taille ('+fmt(w)+' cm) est sous la moitié de ta hauteur. Tu peux viser le dessin musculaire.</div>';
  }
  if(bf!==null)says+='<div class="say"><b>Estimation de masse grasse</b>Calcul à partir du cou, de la taille et de ta hauteur (méthode de la marine américaine). Compte une marge de 3 à 4 points : sers-t’en pour suivre l’évolution, pas comme valeur exacte.</div>';

  if(m.length>=2){
    var d0=new Date(m[0].d),d1=new Date(m[m.length-1].d),days=(d1-d0)/86400000;
    if(days<6){
      says+='<div class="say"><b>Évolution</b>Trop tôt pour conclure. Les mensurations bougent lentement : refais une mesure dans une semaine, dans les mêmes conditions.</div>';
    }else{
      function dl(k){var s=series(m,k);return s.length>=2?s[s.length-1].v-s[0].v:null}
      var dk=dl('kg'),dw=dl('waist'),da=dl('arm'),dc=dl('chest'),dt=dl('thigh'),parts=[];
      if(dk!==null){
        var wk=dk/(days/7),t='Poids : '+sgn(dk)+' kg ('+sgn(wk)+' kg par semaine). ';
        if(wk<-0.8)t+='Rythme un peu rapide : assure tes protéines pour garder ton muscle.';
        else if(wk<=-0.2)t+='Bon rythme de perte.';
        else if(wk>0.3)t+='Le poids monte : si la taille ne bouge pas, c’est peut-être du muscle, sinon surveille les portions.';
        else t+='Poids stable.';
        parts.push(t);
      }
      if(dw!==null){
        parts.push(dw<=-1?'Tour de taille : '+sgn(dw)+' cm, la graisse du ventre recule.':dw>=1?'Tour de taille : '+sgn(dw)+' cm, le ventre progresse : regarde les sucres, l’alcool et marche plus.':'Tour de taille : stable.');
      }
      var mus=[];if(da!==null&&da>=0.5)mus.push('bras');if(dc!==null&&dc>=0.5)mus.push('poitrine');if(dt!==null&&dt>=0.5)mus.push('cuisse');
      if(mus.length)parts.push('Ça grossit côté '+mus.join(', ')+' : le muscle se construit.');
      var verdict,cls='';
      if(dw!==null&&dw<=-1&&(mus.length||(dk!==null&&dk>-0.5))){verdict='Recomposition : tu perds du ventre en gardant ou gagnant du muscle. C’est le meilleur scénario.';cls=' good'}
      else if(dw!==null&&dw<=-1){verdict='Tu perds du gras. Continue la musculation et les protéines pour garder ton muscle.';cls=' good'}
      else if(dw!==null&&dw>=1){verdict='Tendance à la hausse du ventre. Priorité à l’assiette et à la marche quotidienne.';cls=' warn'}
      else{verdict='Plateau. Passe en intensité Intense, ajoute un tour par séance, ou resserre l’alimentation.'}
      says+='<div class="say'+cls+'"><b>Évolution sur '+Math.round(days)+' jours</b>'+parts.join(' ')+'<br><b style="margin-top:6px">Verdict</b>'+verdict+'</div>';
    }
  }else if(m.length===1){
    says+='<div class="say"><b>Point de départ</b>Bien joué, la première mesure est faite. Refais-en une dans une semaine pour voir l’évolution.</div>';
  }
  return (tiles?'<div class="tiles">'+tiles+'</div>':'')+says;
}

function addMeas(){

}

function tbDraw(left){

function tbTick(){

    TB.last=left;var e=document.getElementById('tleft');if(e)e.textContent=left+' s';

  }

/* ---------- séance de salle / de skill (avec poids) ---------- */
var WEIGHTED={bench:1,ohp:1,dipbar:1,pullup:1,row:1,curl:1,backsquat:1,rdl:1};
var HOLDK={planchelean:1,tuckplanche:1,advtuck:1,straddleplanche:1,fullplanche:1,flagvert:1,flagtuck:1,flagstr:1,flagfull:1,planche:1,laterale:1};
function wlog(){var w=load('fit:wlog',{});return w&&typeof w==='object'?w:{}}
function topNum(s){var m=String(s).match(/\d+/g);return m?Math.max.apply(null,m.map(Number)):0}
function lastOf(k){var a=wlog()[k];return a&&a.length?a[a.length-1]:null}
function unitOf(k){return WEIGHTED[k]?'kg':HOLDK[k]?'s':'reps'}
function fmtSets(k,e){return e.s.map(function(x){return (x.kg?fmt(x.kg)+' kg × ':'')+fmt(x.r)+(HOLDK[k]?' s':'')}).join(', ')}
function suggestKg(it){
  var L=lastOf(it.k);if(!L||!it.w)return null;
  var top=topNum(it.reps),kg=0,all=L.s.length>=it.sets;
  L.s.forEach(function(x){kg=Math.max(kg,x.kg||0);if(!(x.r>=top))all=false});
  if(!kg)return null;return {kg:all?kg+2.5:kg,up:all};
}
function startGym(id){
  var d=null;GDAYS.forEach(function(x){if(x.id===id)d=x});if(!d)return;
  newWorkout('Salle : '+d.name,'G',d.ex.map(function(e){return {k:e[0],sets:e[1],reps:e[2],rest:e[3],hold:0,w:!!WEIGHTED[e[0]]}}));
}
function startSkill(w){
  var S0=SKILLS[w],lv=skillLv(w),L=S0.levels[lv],items=[];
  items.push({k:L.k,sets:L.sets,reps:L.hold+' s',rest:90,hold:L.hold,w:false});
  if(lv>0){var P0=S0.levels[lv-1];items.push({k:P0.k,sets:3,reps:'15 s',rest:60,hold:15,w:false})}
  S0.support.forEach(function(e){items.push({k:e[0],sets:e[1],reps:e[2],rest:e[3],hold:e[4],w:false})});
  newWorkout('Calisthénie : '+S0.name.toLowerCase(),'K',items);
}
function newWorkout(title,id,items){
  ensureAudio();
  var done=items.map(function(it){var sg=suggestKg(it),a=[];for(var i=0;i<it.sets;i++)a.push({ok:0,kg:sg?String(sg.kg):'',r:''});return a});
  save('fit:gws',{title:title,id:id,start:Date.now(),items:items,done:done});
  S.tab=id==='K'?'cali':'gym';render();window.scrollTo(0,0);
}
function cellOf(w,i,j){var c=w.done[i][j];if(!c||typeof c!=='object'){c={ok:c?1:0,kg:'',r:''};w.done[i][j]=c}return c}
function setVal(i,j,f,v){var w=load('fit:gws',null);if(!w)return;var c=cellOf(w,i,j);c[f]=String(v).replace(',','.');save('fit:gws',w)}
function togSet(i,j){
  var w=load('fit:gws',null);if(!w)return;
  var it=w.items[i],c=cellOf(w,i,j);
  c.ok=c.ok?0:1;
  if(c.ok&&!c.r)c.r=String(it.hold||topNum(it.reps)||'');
  if(c.ok&&it.w&&!c.kg&&j>0){var p=cellOf(w,i,j-1);if(p.kg)c.kg=p.kg}
  save('fit:gws',w);
  if(c.ok){var last=true;w.done.forEach(function(r,a){r.forEach(function(v,b){if(!cellOf(w,a,b).ok)last=false})});if(!last)startTimer(it.rest,'Repos : '+EX[it.k].n);else stopTimer()}
  render();
}
function holdGo(i){var w=load('fit:gws',null);if(!w)return;var it=w.items[i];startTimer(it.hold,'Tiens : '+EX[it.k].n,true)}
function quitWorkout(){stopTimer();save('fit:gws',null);render()}
function endWorkout(){
  var w=load('fit:gws',null);if(!w)return;
  stopTimer();
  var wl=wlog();
  w.items.forEach(function(it,i){var s=[];w.done[i].forEach(function(c,j){c=cellOf(w,i,j);if(c.ok)s.push({kg:parseFloat(c.kg)||0,r:parseFloat(c.r)||0})});
    if(s.length){(wl[it.k]=wl[it.k]||[]).push({d:new Date().toISOString(),s:s});if(wl[it.k].length>30)wl[it.k].shift()}});
  save('fit:wlog',wl);
  var m=Math.max(1,Math.round((Date.now()-w.start)/60000)),log=load('fit:log',[]),before=earnedIds(log);
  log.push({d:new Date().toISOString(),s:w.title,m:m,id:w.id});save('fit:log',log);
  var nb=earnedIds(log).filter(function(x){return before.indexOf(x)<0}).map(function(id){var n='';BADGES.forEach(function(b){if(b.id===id)n=b.n});return n});
  save('fit:gws',null);
  save('fit:gmsg',{t:'Séance enregistrée : '+m+' min, charges sauvegardées. '+streak(log)+' jour'+(streak(log)>1?'s':'')+' de suite.'+(nb.length?' Nouveau badge : '+nb.join(', ')+'.':'')});
  say('Séance enregistrée. Bravo !');
  render();window.scrollTo(0,0);
}
function vWorkout(w){
  var tot=0,done=0;w.done.forEach(function(r,i){r.forEach(function(v,j){tot++;if(cellOf(w,i,j).ok)done++})});
  var h='<h1>'+esc(w.title)+'</h1><p class="lead">'+done+(done>1?' séries':' série')+' sur '+tot+'. Note tes charges et tes répétitions, puis valide la série : le repos se lance tout seul.</p>';
  w.items.forEach(function(it,i){
    var e=EX[it.k],L=lastOf(it.k),sg=suggestKg(it),u=unitOf(it.k);
    h+='<article class="sess"><h3>'+esc(e.n)+'</h3><p>'+it.sets+' séries de '+esc(it.reps)+', repos '+it.rest+' s</p>';
    if(L)h+='<p class="last">Dernière fois : '+esc(fmtSets(it.k,L))+'</p>';
    if(sg&&sg.up)h+='<p class="last up">Tout réussi la dernière fois : +2,5 kg proposés.</p>';
    h+='<details><summary>Voir la démonstration</summary>'+figHTML(it.k)+'<p class="mus" style="margin:6px 0 0;color:var(--accent);font-weight:500">Muscles : '+esc(MUS[it.k]||'')+'</p><p style="margin:6px 0 0;color:var(--muted);font-size:15px">'+esc(e.d)+'</p></details>';
    h+='<div class="srows">';
    w.done[i].forEach(function(v,j){var c=cellOf(w,i,j);
      h+='<div class="srow'+(c.ok?' ok':'')+'"><span class="sn">'+(j+1)+'</span>';
      if(it.w)h+='<label class="fld kg"><input type="number" inputmode="decimal" step="0.5" min="0" value="'+esc(c.kg)+'" placeholder="0" oninput="setVal('+i+','+j+',\'kg\',this.value)" aria-label="Poids série '+(j+1)+'"><small>kg</small></label>';
      h+='<label class="fld"><input type="number" inputmode="numeric" min="0" value="'+esc(c.r)+'" placeholder="'+(it.hold||topNum(it.reps)||'max')+'" oninput="setVal('+i+','+j+',\'r\',this.value)" aria-label="'+(u==='s'?'Secondes':'Répétitions')+' série '+(j+1)+'"><small>'+(u==='s'?'s':'reps')+'</small></label>';
      h+='<button class="okb'+(c.ok?' on':'')+'" aria-pressed="'+(c.ok?'true':'false')+'" aria-label="Valider la série '+(j+1)+'" onclick="togSet('+i+','+j+')">'+(c.ok?'Fait':'Valider')+'</button></div>';
    });
    h+='</div>';
    if(it.hold)h+='<button class="btn ghost" onclick="holdGo('+i+')">Lancer la tenue de '+it.hold+' s</button>';
    h+='</article>';
  });
  h+='<button class="go" onclick="endWorkout()">Terminer et enregistrer</button><button class="btn ghost" onclick="quitWorkout()">Quitter sans enregistrer</button>';
  return h;
}
function vLoads(){
  var wl=wlog(),keys=Object.keys(wl).filter(function(k){return EX[k]&&wl[k].length});
  if(!keys.length)return '<p class="empty">Tes charges apparaîtront ici après ta première séance validée.</p>';
  var h='';
  keys.forEach(function(k){
    var a=wl[k],L=a[a.length-1],u=unitOf(k),best=0;
    var tops=a.map(function(e){var m=0;e.s.forEach(function(x){var v=u==='kg'?x.kg:x.r;if(v>m)m=v});if(m>best)best=m;return m});
    h+='<div class="tip"><h3>'+esc(EX[k].n)+'</h3><p>Dernière fois, le '+fdateS(L.d)+' : '+esc(fmtSets(k,L))+'.</p><p>Record : <b>'+fmt(best)+' '+u+'</b></p>'+spark(tops,'Meilleure série par séance',u)+'</div>';
  });
  return h;
}
function lvChips(w){
  var S0=SKILLS[w],cur=skillLv(w),h='<div class="seg lv" role="group" aria-label="Niveau '+S0.name+'">';
  S0.levels.forEach(function(L,i){h+='<button aria-pressed="'+(i===cur)+'" onclick="setSkillLv(\''+w+'\','+i+')">'+esc(L.s)+'</button>'});
  return h+'</div>';
}
function skillCard(w){
  var S0=SKILLS[w],lv=skillLv(w),L=S0.levels[lv],e=EX[L.k];
  var h='<article class="sess"><div class="top"><div><h3>'+S0.name+'</h3><p>'+esc(S0.lead)+'</p></div></div>'+lvChips(w);
  h+=figHTML(L.k)+'<b style="font-size:18px;display:block;margin-top:6px">'+esc(e.n)+'</b><p style="margin:4px 0 0;color:var(--muted)">'+esc(e.d)+'</p>';
  h+='<p style="margin:8px 0 0"><b>Objectif :</b> '+esc(L.goal)+'.<br><b>Pour monter d’un niveau :</b> '+esc(L.up)+'</p>';
  h+='<button class="go" onclick="startSkill(\''+w+'\')">Lancer la séance de '+S0.name.toLowerCase()+'</button>';
  h+='<details><summary>Voir toutes les étapes</summary>';
  S0.levels.forEach(function(Lx,i){var ex=EX[Lx.k];h+='<div class="ex">'+figHTML(Lx.k)+'<b>'+(i+1)+'. '+esc(ex.n)+'</b><span>'+esc(ex.d)+'</span><span class="mus">Objectif : '+esc(Lx.goal)+'</span></div>'});
  return h+'</details></article>';
}
function gymProg(){
  var p=load('fit:gprog',null),h='<h2>Programme 8 semaines</h2>';
  h+='<p class="lead" style="margin-top:0">Trois jours de salle, deux jours de calisthénie. Honnêtement : la planche complète et le drapeau complet demandent souvent 6 à 18 mois. Ces 8 semaines t’amènent aux premiers paliers solides.</p>';
  if(!p)return h+'<button class="go" onclick="startGProg()">Commencer le programme</button>';
  var wk=Math.min(8,Math.floor((Date.now()-p.start)/604800000)+1);
  h+='<div class="prog"><h3>Semaine '+wk+' sur 8 : '+esc(WK[wk-1][0])+'</h3><p class="lead" style="margin-top:6px">Planche : <b>'+esc(WK[wk-1][1])+'</b>.<br>Drapeau : <b>'+esc(WK[wk-1][2])+'</b>.</p></div>';
  h+='<table class="tbl"><tr><th>Sem.</th><th>Planche</th><th>Drapeau</th></tr>';
  WK.forEach(function(r,i){h+='<tr'+(i+1===wk?' style="font-weight:600;color:var(--accent)"':'')+'><td>'+(i+1)+'</td><td style="text-align:left">'+esc(r[1])+'</td><td style="text-align:left">'+esc(r[2])+'</td></tr>'});
  h+='</table><button class="btn ghost" onclick="stopGProg()">Arrêter le programme</button>';
  return h;
}
function startGProg(){save('fit:gprog',{start:Date.now()});render()}
function stopGProg(){save('fit:gprog',null);render()}

function setCali(v){S.cali=v;render()}
function vCali(){
  var w=load('fit:gws',null);if(w)return vWorkout(w);
  var t=S.cali||'planche',h='<h1>Calisthénie</h1><p class="lead">Planche et drapeau : niveaux animés, séances et programme. Jours conseillés : mardi planche, jeudi drapeau.</p>';
  var p=todayPlan();if(p.type==='skill')h+=gymBanner();
  h+='<div class="seg" role="group" aria-label="Section">';
  [['planche','Planche'],['flag','Drapeau'],['prog','Programme']].forEach(function(x){h+='<button aria-pressed="'+(t===x[0])+'" onclick="setCali(\''+x[0]+'\')">'+x[1]+'</button>'});
  h+='</div>';
  h+=t==='prog'?gymProg():skillCard(t);
  h+='<p class="small" style="margin-top:14px">Échauffe toujours les poignets et les épaules avant la planche et le drapeau.</p>';
  return h;
}
function vGym(){
  var w=load('fit:gws',null);if(w)return vWorkout(w);
  var msg=load('fit:gmsg',null),h='<h1>Salle</h1><p class="lead">Salle de sport et calisthénie : séances, séries et progressions.</p>';
  if(msg){h+='<div class="say good"><b>Bravo</b>'+esc(msg.t)+'</div>';save('fit:gmsg',null)}
  h+=gymBanner();
  h+='<h2>Jours de salle</h2><p class="lead" style="margin-top:0">Coche les jours où tu vas à la salle : l’appli te propose la séance du jour dans l’ordre push, pull, jambes.</p><div class="week">';
  var dn=['D','L','M','M','J','V','S'],gd=gymDays();
  [1,2,3,4,5,6,0].forEach(function(i){h+='<button class="dayb'+(gd.indexOf(i)>=0?' on':'')+'" aria-pressed="'+(gd.indexOf(i)>=0)+'" onclick="setGymDay('+i+','+(gd.indexOf(i)<0)+')">'+dn[i]+'</button>'});
  h+='</div>';
  h+='<h2>Séances de salle</h2>';
  GDAYS.forEach(function(d,di){
    h+='<article class="sess"><div class="top"><div><h3>'+esc(d.name)+'</h3><p>'+esc(d.tag)+'</p></div><div class="time">'+(gymRot()===di?'Prochaine':'')+'</div></div><button class="go" onclick="startGym(\''+d.id+'\')">Commencer</button>';
    h+='<details><summary>Voir les '+d.ex.length+' exercices</summary>';
    d.ex.forEach(function(e){var ex=EX[e[0]];h+='<div class="ex">'+figHTML(e[0])+'<b>'+esc(ex.n)+'</b><span>'+e[1]+' séries de '+esc(e[2])+', repos '+e[3]+' s</span><span class="mus">Muscles : '+esc(MUS[e[0]]||'')+'</span></div>'});
    h+='</details></article>';
  });
  h+='<h2>Mes charges</h2>'+vLoads();
  h+='<p class="small" style="margin-top:10px">La planche et le drapeau sont dans l’onglet Calisthénie.</p>';
  h+='<p class="small" style="margin-top:14px">Progression : quand tu réussis toutes les séries au haut de la fourchette, l’appli te propose +2,5 kg la fois suivante.</p>';
  return h;
}

/* ---------- séance : minuteur, voix, métronome ---------- */
var R=null,timer=null,actx=null,wake=null,metro=null;
var VOICE=false;try{VOICE=!!window.speechSynthesis}catch(e){}
function say(t){
  if(!S.voice||!VOICE||!t)return;
  try{var u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=1.05;window.speechSynthesis.cancel();window.speechSynthesis.speak(u)}catch(e){}
}
function beep(f,d){
  try{
    if(!actx)return;
    var o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=f;o.type='sine';o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.4,actx.currentTime+.01);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);
    o.start();o.stop(actx.currentTime+d+.02);
  }catch(e){}
}
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function stopMetro(){if(metro){clearInterval(metro);metro=null}}
function startMetro(k){
  stopMetro();
  var d=EXD[k];if(!S.metro||!d||d.noM||!actx)return;
  var n=0;beep(1000,.05);
  metro=setInterval(function(){n++;beep(n%2?700:1000,.05)},d.T/2);
}
function start(si,ov){
  var s=SESS[si];
  pickScene();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}catch(e){}
  var pl=plan(s,ov);
  R={s:s,steps:pl.steps,rounds:pl.rounds,i:0,paused:false,t0:Date.now(),prog:!!(ov&&ov.prog),before:earnedIds(load('fit:log',[]))};
  R.total=R.steps.reduce(function(a,x){return a+x.dur},0);
  say('C’est parti');
  enter(0);
  document.getElementById('run').classList.add('on');
  clearInterval(timer);timer=setInterval(tick,200);
}
function enter(i){
  R.i=i;var st=R.steps[i];
  R.end=Date.now()+st.dur*1000;R.left=st.dur;R.lastShown=-1;RUNT0=performance.now();
  if(st.t==='work'){
    if(R.lastRound!==undefined&&st.round!==R.lastRound&&st.round>1)pickScene();
    R.lastRound=st.round;
  }
  var r=document.getElementById('run');
  r.className='on'+(st.t==='rest'?' rest':st.t==='cool'?' cool':'');
  var e=st.k?EX[st.k]:null,h='';
  var phase=st.t==='warm'?'Échauffement':st.t==='rest'?'Repos':st.t==='cool'?'Étirement':'Tour '+st.round+' sur '+R.rounds;
  h+='<div class="rtop"><span>'+esc(R.s.name)+'</span><span>'+(i+1)+' / '+R.steps.length+'</span></div>';
  h+='<div class="bar"><i id="bar"></i></div>';
  h+='<div class="rmid"><div class="phase">'+phase+'</div><div class="count" id="cnt">'+st.dur+'</div>';
  if(st.t==='rest'){
    var nx=st.next?EX[st.next]:null;
    h+=figHTML('repos')+'<div class="rname">Respire</div>'+(nx?'<div class="next">Ensuite : '+esc(nx.n)+'</div>':'');
  }else{
    h+=figHTML(st.k)+'<div class="rname">'+esc(e.n)+'</div><div class="rdesc">'+esc(e.d)+'</div>';
    if(st.t==='work'&&e.e)h+='<div class="reasy">Plus facile : '+esc(e.e)+'</div>';
  }
  h+='</div><div class="rbtn"><button id="pz" class="main" onclick="pause()">Pause</button><button onclick="skip()">Passer</button><button onclick="quit()">Quitter</button></div>';
  r.innerHTML=h;
  stopMetro();
  if(st.t==='work'){beep(880,.35);buzz(200);startMetro(st.k);say(e.n)}
  else if(st.t==='rest'){beep(520,.25);buzz([80,60,80]);say('Repos.'+(st.next?' Ensuite, '+EX[st.next].n:''))}
  else if(st.t==='cool'){beep(520,.2);say((R.steps[i-1]&&R.steps[i-1].t!=='cool'?'Étirements. ':'')+e.n+'. Respire.')}
  else{beep(660,.2);say(e.n)}
  updBar();
}
function updBar(){
  var done=0;for(var n=0;n<R.i;n++)done+=R.steps[n].dur;
  var cur=R.steps[R.i];done+=cur.dur-R.left;
  var b=document.getElementById('bar');if(b)b.style.width=Math.min(100,done/R.total*100)+'%';
}
function tick(){
  if(!R||R.paused)return;
  var st=R.steps[R.i],left=Math.max(0,Math.ceil((R.end-Date.now())/1000));
  if(left!==R.lastShown){
    R.lastShown=left;R.left=left;
    var c=document.getElementById('cnt');if(c)c.textContent=left;
    if(left>0&&left<=3){beep(740,.12)}
    if(st.t==='work'&&st.dur>=30&&left===10)say('Plus que dix secondes');
    updBar();
  }
  if(Date.now()>=R.end){
    if(R.i+1>=R.steps.length)finish();else enter(R.i+1);
  }
}
function pause(){
  if(!R)return;
  var b=document.getElementById('pz');
  if(!R.paused){R.paused=true;R.rem=R.end-Date.now();b.textContent='Reprendre';stopMetro();try{if(VOICE)window.speechSynthesis.cancel()}catch(e){}}
  else{R.paused=false;R.end=Date.now()+R.rem;b.textContent='Pause';var st=R.steps[R.i];RUNT0=performance.now();if(st.t==='work')startMetro(st.k)}
}
function skip(){if(!R)return;if(R.i+1>=R.steps.length)finish();else enter(R.i+1)}
function release(){
  clearInterval(timer);timer=null;stopMetro();
  try{if(VOICE)window.speechSynthesis.cancel()}catch(e){}
  try{if(wake){wake.release();wake=null}}catch(e){}
}
function quit(){release();R=null;document.getElementById('run').className='';render()}
function finish(){
  release();
  var run=R;R=null;
  var m=Math.max(1,Math.round((Date.now()-run.t0)/60000));
  var log=load('fit:log',[]);log.push({d:new Date().toISOString(),s:run.s.name,m:m,id:run.s.id});save('fit:log',log);
  var extra='';
  if(run.prog){var p=getProg();if(p){p.i=Math.min(12,p.i+1);if(p.i>=12)save('fit:progdone',true);save('fit:prog',p);extra+='<div class="rdesc">Programme : '+p.i+' séances sur 12.</div>'}}
  var now=earnedIds(log),nb=now.filter(function(x){return run.before.indexOf(x)<0});
  nb.forEach(function(id){BADGES.forEach(function(b){if(b.id===id)extra+='<div class="rdesc"><b>Nouveau badge : '+b.n+'</b></div>'})});
  var r=document.getElementById('run');r.className='on done';
  r.innerHTML='<div class="rmid"><div class="count" style="font-size:min(30vw,150px)">Bravo</div><div class="rname">Séance terminée</div><div class="rdesc">'+m+' min de travail. '+streak(log)+' jour'+(streak(log)>1?'s':'')+' de suite. Bois de l’eau.</div>'+extra+'</div><div class="rbtn"><button class="main" onclick="closeDone()">Voir mon suivi</button></div>';
  beep(660,.2);setTimeout(function(){beep(880,.2)},220);setTimeout(function(){beep(1100,.35)},440);buzz([200,100,200,100,400]);
  say('Séance terminée. Bravo !'+(nb.length?' Nouveau badge débloqué.':''));
}
function closeDone(){document.getElementById('run').className='';S.tab='track';render()}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&R&&!R.paused&&!wake){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}catch(e){}}
});
render();
requestAnimationFrame(loop);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
